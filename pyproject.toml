[project]
name = "r6ax-learn"
version = "0.1.0-beta.2"
description = "AI-assisted learning platform based on Learning by Teaching"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "babel>=2.16",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "python-jose[cryptography]>=3.3",
    "passlib>=1.7",
    "openai>=1.50",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "httpx>=0.27",
    # 向量检索为纯 Python 词法降级（无重依赖）；可选语义增强需自行安装
    # sentence-transformers + numpy 并预下载 embedding 模型（见 scripts/download_embedding_model.py）
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["app/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
