[project]
name = "r6ax-learn"
version = "1.1.0"
description = "AI-assisted learning platform based on Learning by Teaching"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "babel>=2.16",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "sqlite-vec>=0.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "openai>=1.50",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "httpx>=0.27",
    # 本地RAG依赖（容器友好）
    "sentence-transformers>=2.2",  # 轻量级embedding模型
    "numpy>=1.24",  # 向量计算
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["app/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
